<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>SnapAsk</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>
  <canvas id="board"></canvas>

  <div id="hint" class="hint"><span data-i18n="Drag to select a region ·">Kéo để chọn vùng ·</span> <kbd>Esc</kbd></div>

  <div id="size" class="size" hidden></div>

  <div id="tools" class="tools" hidden>
    <div class="tools__group">
      <button class="tool tool--on" data-tool="move" title="Di chuyển, đổi kích thước" data-i18n-title="Move, resize">
        <svg viewBox="0 0 20 20"><path d="M10 2v16M2 10h16M10 2 7.5 4.5M10 2l2.5 2.5M10 18l-2.5-2.5M10 18l2.5-2.5M2 10l2.5-2.5M2 10l2.5 2.5M18 10l-2.5-2.5M18 10l-2.5 2.5"/></svg>
      </button>
      <button class="tool" data-tool="rect" title="Khung chữ nhật" data-i18n-title="Rectangle">
        <svg viewBox="0 0 20 20"><rect x="3" y="4.5" width="14" height="11" rx="1.5"/></svg>
      </button>
      <button class="tool" data-tool="arrow" title="Mũi tên" data-i18n-title="Arrow">
        <svg viewBox="0 0 20 20"><path d="M4 16 16 4M16 4h-6M16 4v6"/></svg>
      </button>
      <button class="tool" data-tool="pen" title="Vẽ tay" data-i18n-title="Freehand">
        <svg viewBox="0 0 20 20"><path d="M3 17c2-1 2-5 4.5-5S10 16 12 15s2.5-7 5-9"/></svg>
      </button>
      <button class="tool" data-tool="text" title="Chữ" data-i18n-title="Text">
        <svg viewBox="0 0 20 20"><path d="M4 5h12M10 5v11M7.5 16h5"/></svg>
      </button>
      <button class="tool" data-tool="blur" title="Che thông tin nhạy cảm" data-i18n-title="Blur sensitive information">
        <svg viewBox="0 0 20 20"><rect x="3" y="5" width="14" height="10" rx="1.5"/><path d="M5.5 8h2M9 8h2M12.5 8h2M5.5 12h2M9 12h2M12.5 12h2"/></svg>
      </button>
    </div>

    <span class="tools__sep"></span>
    <div class="tools__group" id="colors"></div>
    <span class="tools__sep"></span>

    <div class="tools__group">
      <button class="tool" data-action="undo" title="Hoàn tác (Ctrl+Z)" data-i18n-title="Undo (Ctrl+Z)">
        <svg viewBox="0 0 20 20"><path d="M7 7H4V4M4.5 7A6.5 6.5 0 1 1 4 11"/></svg>
      </button>
      <button class="tool" data-action="copy" title="Sao chép ảnh (Ctrl+C)" data-i18n-title="Copy image (Ctrl+C)">
        <svg viewBox="0 0 20 20"><rect x="6" y="6" width="10" height="10" rx="1.5"/><path d="M12 6V4.5A1.5 1.5 0 0 0 10.5 3h-6A1.5 1.5 0 0 0 3 4.5v6A1.5 1.5 0 0 0 4.5 12H6"/></svg>
      </button>
      <button class="tool" data-action="save" title="Lưu về máy (Ctrl+S)" data-i18n-title="Save to disk (Ctrl+S)">
        <svg viewBox="0 0 20 20"><path d="M10 3v9M10 12l-3.5-3.5M10 12l3.5-3.5M3.5 15.5h13"/></svg>
      </button>
    </div>

    <button class="ask" data-action="ask" data-i18n="Ask the AI">Hỏi AI</button>
  </div>

  <input id="text-input" class="text-input" hidden autocomplete="off" spellcheck="false">

  <div id="toast" class="toast" hidden></div>

  <script src="i18n.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
