<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title data-i18n="SnapAsk · Account">SnapAsk · Tài khoản</title>
<link rel="stylesheet" href="app.css">
</head>
<body class="auth">
  <header class="auth__brand">
    <svg class="auth__mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="8" fill="#1a1816" stroke="#322d27"/>
      <g fill="#e3a04b">
        <path d="M9 9h5v2.4H11.4V14H9zM23 9h-5v2.4h2.6V14H23zM9 23h5v-2.4H11.4V18H9zM23 23h-5v-2.4h2.6V18H23z"/>
      </g>
      <rect x="14.6" y="14.6" width="2.8" height="2.8" rx=".6" fill="#f3efe8"/>
    </svg>
    <h1>SnapAsk</h1>
  </header>

  <section id="guest">
    <p class="auth__lead" id="lead" data-i18n="Snap a region of your screen and ask AI right there.">Chụp một vùng màn hình, hỏi AI ngay tại chỗ.</p>

    <div class="tabs" role="tablist">
      <button type="button" class="tabs__tab tabs__tab--on" data-mode="login" role="tab" data-i18n="Sign in">Đăng nhập</button>
      <button type="button" class="tabs__tab" data-mode="register" role="tab" data-i18n="Sign up">Đăng ký</button>
    </div>

    <form id="form" class="auth__form">
      <label class="only-register">
        <span data-i18n="Your name">Tên của bạn</span>
        <input id="name" type="text" autocomplete="name" placeholder="Nguyễn Văn A"
               data-i18n-placeholder="Nguyen Van A">
      </label>

      <label>
        <span data-i18n="Email">Email</span>
        <input id="email" type="email" autocomplete="username" required>
      </label>

      <label>
        <span data-i18n="Password">Mật khẩu</span>
        <input id="password" type="password" autocomplete="current-password" required>
      </label>

      <label class="only-register">
        <span data-i18n="Confirm password">Nhập lại mật khẩu</span>
        <input id="password2" type="password" autocomplete="new-password">
      </label>

      <p id="error" class="auth__error" hidden></p>
      <p id="notice" class="auth__notice" role="status" hidden></p>

      <button id="submit" type="submit" data-i18n="Sign in">Đăng nhập</button>
    </form>

    <div class="divider"><span data-i18n="or continue with">hoặc tiếp tục với</span></div>

    <div class="socials">
      <button type="button" class="social" data-provider="google">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M23 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.17a5.28 5.28 0 0 1-2.29 3.46v2.88h3.7C21.74 18.78 23 15.8 23 12.27Z"/>
          <path fill="#34A853" d="M12 23.5c3.1 0 5.7-1.03 7.6-2.79l-3.71-2.88c-1.03.69-2.35 1.1-3.89 1.1-2.99 0-5.52-2.02-6.43-4.73H1.73v2.97A11.49 11.49 0 0 0 12 23.5Z"/>
          <path fill="#FBBC05" d="M5.57 14.2a6.9 6.9 0 0 1 0-4.4V6.83H1.73a11.5 11.5 0 0 0 0 10.34l3.84-2.97Z"/>
          <path fill="#EA4335" d="M12 5.07c1.69 0 3.2.58 4.4 1.72l3.28-3.28C17.7 1.6 15.1.5 12 .5A11.49 11.49 0 0 0 1.73 6.83L5.57 9.8C6.48 7.09 9.01 5.07 12 5.07Z"/>
        </svg>
        Google
      </button>

      <button type="button" class="social" data-provider="facebook">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#1877F2" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.09 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.96h-1.51c-1.49 0-1.96.93-1.96 1.89v2.26h3.33l-.53 3.49h-2.8V24C19.61 23.09 24 18.1 24 12.07Z"/>
        </svg>
        Facebook
      </button>

      <button type="button" class="social" data-provider="zalo">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect width="24" height="24" rx="6" fill="#0068FF"/>
          <text x="12" y="16" text-anchor="middle" font-family="system-ui, sans-serif"
                font-size="9" font-weight="700" fill="#fff">Zalo</text>
        </svg>
        Zalo
      </button>
    </div>

    <p id="social-note" class="auth__note auth__note--center" hidden></p>
  </section>

  <section id="signed" class="auth__signed" hidden>
    <p id="who" class="auth__who"></p>
    <p id="quota" class="auth__quota"></p>

    <p class="auth__hotkey"><span data-i18n="Capture hotkey">Phím tắt chụp</span> <kbd id="hotkey">Ctrl + Alt + W</kbd></p>

    <h2 class="auth__heading" data-i18n="Services for the AI to look up">Dịch vụ cho AI tra cứu</h2>
    <p class="auth__note" data-i18n="Declare a service that speaks MCP so the AI reads real data instead of guessing from the screenshot. That is done on the management page.">
      Khai báo dịch vụ theo chuẩn MCP để AI đọc được dữ liệu thật, thay vì chỉ
      đoán từ ảnh chụp. Việc này làm trên trang quản lý.
    </p>
    <button id="manage" type="button" data-i18n="Open the management page">Mở trang quản lý</button>

    <button id="logout" type="button" class="auth__ghost" data-i18n="Sign out">Đăng xuất</button>
  </section>

  <!-- Nút ngôn ngữ nằm ngoài hai khối trên: dùng được cả lúc chưa đăng nhập. -->
  <div class="auth__lang">
    <button type="button" class="auth__ghost" id="lang-vi" lang="vi">Tiếng Việt</button>
    <button type="button" class="auth__ghost" id="lang-en" lang="en">English</button>
  </div>

  <script src="i18n.js"></script>
  <script src="login.js"></script>
</body>
</html>
